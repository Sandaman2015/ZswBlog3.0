name: Build and Deploy Docker Image to Alibaba Cloud

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      build_version:
        description: '指定构建版本号（默认 latest-N）'
        required: false
        type: string

jobs:
  build-and-deploy:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    environment: develop

    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 设置构建版本号
        id: set_build_version
        run: |
          if [ -z "${{ github.event.inputs.build_version }}" ]; then
            echo "BUILD_VERSION=latest-${{ github.run_number }}" >> $GITHUB_ENV
          else
            echo "BUILD_VERSION=${{ github.event.inputs.build_version }}" >> $GITHUB_ENV
          fi

      - name: 安装 Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: 登录阿里云容器 Registry
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          registry: registry.cn-hangzhou.aliyuncs.com
      - name: 设置 Docker 构建参数
        run: |
          echo "LOCAL_REPO=my-app" >> $GITHUB_ENV
          echo "DOCKERFILE_PATH=./app/Dockerfile" >> $GITHUB_ENV
          echo "BUILD_CONTEXT=./app" >> $GITHUB_ENV
            - name: 构建 Docker 镜像
              run: |
                docker build \
                  --tag ${{ env.LOCAL_REPO }}:${{ env.BUILD_VERSION }} \
                  --file ${{ env.DOCKERFILE_PATH }} \
                  ${{ env.BUILD_CONTEXT }}

      - name: 打标签并推送到阿里云
        run: |
          docker tag ${{ env.LOCAL_REPO }}:${{ env.BUILD_VERSION }} registry.cn-hangzhou.aliyuncs.com/${{ env.REMOTE_REPO_NAME }}:${{ env.BUILD_VERSION }}
          docker push registry.cn-hangzhou.aliyuncs.com/${{ env.REMOTE_REPO_NAME }}:${{ env.BUILD_VERSION }}

      - name: 清理本地镜像
        run: |
          docker rmi registry.cn-hangzhou.aliyuncs.com/${{ env.REMOTE_REPO_NAME }}:${{ env.BUILD_VERSION }} || true
          docker image prune -af
