name: Build and Deploy Docker Image to Alibaba Cloud

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      build_version:
        description: '指定构建版本号（默认 latest-N）'
        required: false
        type: string

jobs:
  build-and-deploy:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    environment: develop
    env:
      LOCAL_REPO: zswblogui
      REMOTE_REPO_NAME: zswblogui
      DOCKERFILE_PATH: ./app/Dockerfile
      BUILD_CONTEXT: ./app

    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 设置构建版本号
        id: set_build_version
        run: |
          if [ -z "${{ github.event.inputs.build_version }}" ]; then
            echo "BUILD_VERSION=latest-${{ github.run_number }}" >> $GITHUB_ENV
          else
            echo "BUILD_VERSION=${{ github.event.inputs.build_version }}" >> $GITHUB_ENV
          fi

      - name: 安装 Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: 登录阿里云容器 Registry
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          registry: registry.cn-hangzhou.aliyuncs.com

      - name: 打印当前环境变量（调试用）
        run: |
          echo "======================="
          echo " LOCAL_REPO        = ${{ env.LOCAL_REPO }}"
          echo " REMOTE_REPO_NAME  = ${{ env.REMOTE_REPO_NAME }}"
          echo " DOCKERFILE_PATH   = ${{ env.DOCKERFILE_PATH }}"
          echo " BUILD_CONTEXT     = ${{ env.BUILD_CONTEXT }}"
          echo " BUILD_VERSION     = ${{ env.BUILD_VERSION }}"
          echo "======================="

      - name: 打印当前目录结构（调试用）
        run: |
          echo "==> 当前工作目录内容："
          ls -la ${{ env.BUILD_CONTEXT }}

      - name: 检查 Dockerfile 是否存在
        run: |
          if [ -f "${{ env.DOCKERFILE_PATH }}" ]; then
            echo "✅ Dockerfile 存在：${{ env.DOCKERFILE_PATH }}"
          else
            echo "❌ 错误：Dockerfile 不存在于路径：${{ env.DOCKERFILE_PATH }}" >&2
            exit 1
          fi

      - name: 构建 Docker 镜像
        run: |
          docker build \
            --tag ${{ env.LOCAL_REPO }}:${{ env.BUILD_VERSION }} \
            --file ${{ env.DOCKERFILE_PATH }} \
            ${{ env.BUILD_CONTEXT }}

      - name: 打标签并推送到阿里云
        run: |
          docker tag ${{ env.LOCAL_REPO }}:${{ env.BUILD_VERSION }} registry.cn-hangzhou.aliyuncs.com/${{ env.REMOTE_REPO_NAME }}:${{ env.BUILD_VERSION }}
          docker push registry.cn-hangzhou.aliyuncs.com/${{ env.REMOTE_REPO_NAME }}:${{ env.BUILD_VERSION }}

      - name: 清理本地镜像
        run: |
          docker rmi registry.cn-hangzhou.aliyuncs.com/${{ env.REMOTE_REPO_NAME }}:${{ env.BUILD_VERSION }} || true
          docker image prune -af
